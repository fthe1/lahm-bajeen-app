name: Build from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q LahmBajeen-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: LahmBajeen
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Build AAB
        working-directory: LahmBajeen
        run: gradle bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LahmBajeen-APK
          path: LahmBajeen/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LahmBajeen-AAB
          path: LahmBajeen/app/build/outputs/bundle/release/*.aab
